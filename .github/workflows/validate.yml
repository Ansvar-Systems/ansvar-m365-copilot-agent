name: Validate app package

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0 pillow==12.3.0

      # Runs without AUTH_CONFIG_ID on purpose: the committed template is
      # validated with a dummy substitution, so CI never needs the real id.
      - name: Validate app package
        run: ./scripts/validate.sh
