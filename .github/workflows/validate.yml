name: Validate app package

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0 pillow==12.3.0

      # Runs without AUTH_CONFIG_ID on purpose: the committed template is
      # validated with a dummy substitution, so CI never needs the real id.
      - name: Validate app package
        run: ./scripts/validate.sh

      # Proves the packaging path works on every commit. The id below is a
      # throwaway that satisfies the shape check; it is not a real registration,
      # and the resulting zip is asserted then discarded, never uploaded.
      - name: Build package with a dummy auth id
        env:
          AUTH_CONFIG_ID: ci0123456789abcdef
        run: |
          ./scripts/package.sh
          python3 - <<'PY'
          import json, sys, zipfile

          EXPECTED = ["manifest.json", "declarativeAgent.json", "ai-plugin.json", "color.png", "outline.png"]
          DUMMY = "ci0123456789abcdef"
          failures = []

          with zipfile.ZipFile("dist/ansvar-m365-copilot.zip") as zf:
              names = zf.namelist()
              if names != EXPECTED:
                  failures.append(f"members are {names}, expected {EXPECTED}")
              if any("/" in n for n in names):
                  failures.append(f"members must sit at the zip root: {names}")
              for member in [n for n in names if n.endswith(".json")]:
                  try:
                      json.loads(zf.read(member).decode("utf-8"))
                  except json.JSONDecodeError as exc:
                      failures.append(f"{member} is not valid JSON: {exc}")
              plugin = json.loads(zf.read("ai-plugin.json").decode("utf-8"))
              got = plugin["runtimes"][0]["auth"]["reference_id"]
              if got != DUMMY:
                  failures.append(f"reference_id is {got!r}, expected {DUMMY!r}")

          if failures:
            print("FAILED:", "; ".join(failures))
            sys.exit(1)
          print(f"zip verified: {EXPECTED} at root, JSON members parse, reference_id == {DUMMY}")
          PY

      - name: Discard the dummy artifact
        if: always()
        run: rm -rf dist
